[project]
name = "qq-ai-chatbot"
version = "1.0.0"
description = "可自定义人格的QQ群聊AI自动回复机器人"
requires-python = ">=3.10"
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-plugin-apscheduler>=0.4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.nonebot]
plugins = []
plugin_dirs = ["plugins"]
builtin_plugins = ["nonebot_plugin_apscheduler"]

[[tool.nonebot.adapters]]
name = "OneBot V11"
module_name = "nonebot.adapters.onebot.v11"
